# SonarQube Cloud analysis. Run by .github/workflows/ci.yml, which calls the shared
# workflow at gortazar/aideas/.github/workflows/sonar.yml@v1 — see
# https://github.com/gortazar/aideas/blob/main/ideas/quality-gate/README.md
sonar.projectKey=gortazar_restore-wss
sonar.organization=gortazar
sonar.sourceEncoding=UTF-8

# Three languages in one repository: the Python daemon and native host, and the GJS
# extension half.
sonar.sources=src
sonar.tests=tests

# Recorded window layouts, not code.
sonar.exclusions=tests/fixtures/**

# Written by the coverage job in ci.yml and handed to the scan as an artifact. Only the
# unit suite is measured: tests/dbus needs a session bus, and running it twice to
# instrument it would buy a few percent for a lot of flakiness.
sonar.python.coverage.reportPaths=coverage.xml

# The JavaScript halves are excluded from *coverage only* — they are still analysed for
# bugs, smells and duplication. No Python coverage run can execute a line of them: the
# GNOME Shell extension runs inside gjs in the compositor's process, and the browser
# extension inside Firefox. Leaving them in the denominator does not measure a testing gap,
# it measures the fact that Python cannot run JavaScript — 360 lines of it, all counted as
# uncovered, which is most of the distance between the daemon's real figure and the 62.4%
# the project reports.
#
# This narrows what the quality gate can see, so it is listed with every other exclusion in
# gortazar/aideas → ideas/quality-gate/exclusions.md. Everything pytest could reach stays
# in, including the native messaging host and the daemon: those are genuine coverage gaps,
# not structural ones, and hiding them would be the dishonest kind of green.
sonar.coverage.exclusions=src/extension/**,src/browser-extension/**
